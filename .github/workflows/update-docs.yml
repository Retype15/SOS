# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Update documentation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

env:
  CI_DEPLOY_DIR: docs/ci-deploy
  CI_ARTIFACTS_DIR: docs/ci-artifacts
  DOCS_CS_ROOT: docs/cs

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Run build script
        working-directory: ${{ env.DOCS_CS_ROOT }}
        run: ./scripts/build.sh

      - name: Create tarball
        run: |
          mkdir -p "$CI_ARTIFACTS_DIR"
          tar -czf "$CI_ARTIFACTS_DIR"/cs.tar.gz -C "$DOCS_CS_ROOT"/build .

      - name: Upload tarball
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: docs-cs
          path: ${{ env.CI_ARTIFACTS_DIR }}/cs.tar.gz

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [update-docs]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - run: mkdir -p "$CI_ARTIFACTS_DIR" "$CI_DEPLOY_DIR"

      - name: "Download build artifacts: cs docs"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: docs-cs
          path: ${{ env.CI_ARTIFACTS_DIR }}

      - name: Extract cs tarball to deploy root
        run: |
          tar -xzf "$CI_ARTIFACTS_DIR"/cs.tar.gz -C "$CI_DEPLOY_DIR"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e #v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.CI_DEPLOY_DIR }}
          keep_files: false
