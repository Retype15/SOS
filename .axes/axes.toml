name = "SOS"
version = "0.1.0"
description = "Base mod data visualizer for barotrauma game."

[scripts] # axes /run
run = ["><scripts::build>", "><scripts::run_baro>"]
run_baro = "@start steam://run/602960"              # steam barotrauma
build = "@dotnet build"

[options.open_with] # axes SOS open
default = 'vsc'
explorer = "explorer \"<path>\""
vsc = "vsc \"<path>\""
shell.windows = "wt -d \"<path>\""

[vars]
Hello = "Hello from an axes variable!"

[env]
